<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravings Cafe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef5ff; text-align: center; margin: 0; padding-bottom: 50px; }
        h1 { background: #e51ec7; color: white; padding: 20px; margin: 0; }
        
        .menu { display: flex; justify-content: center; gap: 20px; margin: 20px; flex-wrap: wrap; }
        .item { 
            background: white; width: 220px; padding: 15px; border-radius: 10px; 
            box-shadow: 0 4px 12px rgba(6, 48, 145, 0.15); 
        }
        img { width: 100%; height: 140px; border-radius: 8px; object-fit: cover; background: #ddd; }

        .qty-controls { 
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; 
        }
        .btn-qty { 
            width: 35px; height: 35px; border-radius: 50%; border: none; 
            background: #1e88e5; color: white; font-weight: bold; cursor: pointer; 
        }
        .btn-qty:hover { background: #1565c0; }
        .qty-display { font-size: 18px; font-weight: bold; min-width: 30px; display: inline-block; }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.6);
        }
        .modal-content {
            background: white; margin: 10% auto; padding: 25px; border-radius: 15px; 
            width: 90%; max-width: 400px; text-align: left;
        }
        .cart-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .tax-row { display: flex; justify-content: space-between; padding: 5px 0; color: #555; font-size: 0.9em; }
        
        .view-cart-btn {
            position: fixed; bottom: 20px; right: 20px; padding: 15px 25px;
            background: #ff9800; color: white; border: none; border-radius: 50px;
            font-size: 18px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 999;
        }
    </style>
</head>
<body>

<h1>☕ LAAZAWAB CAFE </h1>

<div class="menu">
    <div class="item">
        <img src="https://toppng.com/uploads/preview/coffee-png-11552943109hqc0f3jjvx.png" alt="Coffee">
        <h3>Coffee – ₹50</h3>
        <div class="qty-controls">
            <button class="btn-qty" onclick="changeQty('coffee', -1)">−</button>
            <span class="qty-display" id="qCoffee">0</span>
            <button class="btn-qty" onclick="changeQty('coffee', 1)">+</button>
        </div>
    </div>

    <div class="item">
        <img src="https://static.vecteezy.com/system/resources/previews/048/093/831/non_2x/close-up-fresh-beef-burger-isolated-on-transparent-background-png.png" alt="Burger">
        <h3>Burger – ₹120</h3>
        <div class="qty-controls">
            <button class="btn-qty" onclick="changeQty('burger', -1)">−</button>
            <span class="qty-display" id="qBurger">0</span>
            <button class="btn-qty" onclick="changeQty('burger', 1)">+</button>
        </div>
    </div>

    <div class="item">
        <img src="https://static.vecteezy.com/system/resources/previews/052/241/706/non_2x/cheese-pizza-clipart-for-food-themed-social-posts-free-png.png" alt="Pizza">
        <h3>Pizza – ₹200</h3>
        <div class="qty-controls">
            <button class="btn-qty" onclick="changeQty('pizza', -1)">−</button>
            <span class="qty-display" id="qPizza">0</span>
            <button class="btn-qty" onclick="changeQty('pizza', 1)">+</button>
        </div>
    </div>

    <div class="item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0tHZbMGdAowYmtcB2xPINZJp38TILBaBozw&s" alt="Cake">
        <h3>Cake – ₹90</h3>
        <div class="qty-controls">
            <button class="btn-qty" onclick="changeQty('cake', -1)">−</button>
            <span class="qty-display" id="qCake">0</span>
            <button class="btn-qty" onclick="changeQty('cake', 1)">+</button>
        </div>
    </div>
</div>

<div id="total" style="font-size: 24px; color: #0d47a1; margin: 20px; font-weight: bold;">Total: ₹0</div>

<button class="view-cart-btn" onclick="toggleModal(true)">🛒 View Cart</button>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0; color:#1e88e5;">Your Order</h2>
        <div id="cartItems"></div>
        <div id="taxDetails" style="margin-top: 15px; border-top: 2px solid #1e88e5; padding-top: 10px;">
            </div>
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <button onclick="toggleModal(false)" style="background:#888; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Close</button>
            <button onclick="generateInvoice()" style="background:#4caf50; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Download Invoice</button>
        </div>
    </div>
</div>

<script>
    let items = {
        coffee: { price: 50, qty: 0 },
        burger: { price: 120, qty: 0 },
        pizza: { price: 200, qty: 0 },
        cake: { price: 90, qty: 0 }
    };

    const TAX_RATE = 0.05; // 5% Tax

    function changeQty(itemName, amount) {
        if (items[itemName].qty + amount >= 0) {
            items[itemName].qty += amount;
            document.getElementById("q" + capitalize(itemName)).innerText = items[itemName].qty;
            updateTotal();
        }
    }

    function updateTotal() {
        let subtotal = 0;
        for (let key in items) {
            subtotal += items[key].price * items[key].qty;
        }
        // Basic display shows subtotal
        document.getElementById("total").innerText = "Total: ₹" + subtotal;
        return subtotal;
    }

    function toggleModal(show) {
        const modal = document.getElementById("cartModal");
        const container = document.getElementById("cartItems");
        const taxContainer = document.getElementById("taxDetails");
        
        if (show) {
            let html = "";
            let subtotal = 0;
            for (let key in items) {
                if (items[key].qty > 0) {
                    let cost = items[key].qty * items[key].price;
                    subtotal += cost;
                    html += `<div class="cart-row">
                                <span><strong>${capitalize(key)}</strong> x ${items[key].qty}</span>
                                <span>₹${cost}</span>
                             </div>`;
                }
            }
            
            let tax = subtotal * TAX_RATE;
            let grandTotal = subtotal + tax;

            container.innerHTML = html || "<p style='text-align:center;'>Your cart is empty!</p>";
            
            taxContainer.innerHTML = `
                <div class="tax-row"><span>Subtotal:</span><span>₹${subtotal}</span></div>
                <div class="tax-row"><span>GST (5%):</span><span>₹${tax.toFixed(2)}</span></div>
                <div class="cart-row" style="font-size: 1.2em; border-bottom: none;">
                    <strong>Grand Total:</strong><strong>₹${grandTotal.toFixed(2)}</strong>
                </div>
            `;
            
            modal.style.display = "block";
        } else {
            modal.style.display = "none";
        }
    }

    function capitalize(word) { return word.charAt(0).toUpperCase() + word.slice(1); }

    function generateInvoice() {
        const subtotal = updateTotal();
        if (subtotal === 0) {
            alert("Please add items to your cart first!");
            return;
        }

        const tax = subtotal * TAX_RATE;
        const grandTotal = subtotal + tax;

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let yPos = 20;

        doc.setFontSize(22);
        doc.text("CRAVINGS CAFE INVOICE", 105, yPos, { align: "center" });
        yPos += 20;

        doc.setFontSize(12);
        doc.text("Item", 20, yPos);
        doc.text("Qty", 90, yPos);
        doc.text("Total", 160, yPos);
        doc.line(20, yPos + 2, 190, yPos + 2);
        yPos += 10;

        for (let key in items) {
            if (items[key].qty > 0) {
                doc.text(capitalize(key), 20, yPos);
                doc.text(items[key].qty.toString(), 90, yPos);
                doc.text("Rs. " + (items[key].qty * items[key].price), 160, yPos);
                yPos += 10;
            }
        }

        yPos += 10;
        doc.line(120, yPos, 190, yPos);
        yPos += 10;
        doc.text("Subtotal: Rs. " + subtotal, 160, yPos, { align: "right" });
        yPos += 7;
        doc.text("GST (5%): Rs. " + tax.toFixed(2), 160, yPos, { align: "right" });
        yPos += 10;
        doc.setFontSize(16);
        doc.setFont(undefined, 'bold');
        doc.text("Grand Total: Rs. " + grandTotal.toFixed(2), 160, yPos, { align: "right" });
        
        doc.save("Cravings_Invoice_Taxed.pdf");
    }
</script>

</body>
</html>
